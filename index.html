<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Filter Selector</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        #filtersContainer {
            margin-bottom: 20px;
        }
        .filter-row {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .dropdown-container {
            position: relative;
            flex: 1;
        }
        .value-container {
            position: relative;
            flex: 2;
        }
        .value-input-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 4px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-height: 40px;
            align-items: center;
            background-color: white;
            cursor: text;
            box-sizing: border-box;
        }
        .value-input-wrapper:not(.has-tags) {
            border: none;
            padding: 0;
            min-height: 40px;
            height: 40px;
            display: block;
        }
        .value-input-wrapper:not(.has-tags) .value-input-field {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 8px;
            height: 40px;
            width: 100%;
            box-sizing: border-box;
            line-height: 1.5;
            font-size: 14px;
        }
        .value-input-wrapper.invalid {
            border-color: #dc3545;
            animation: shake 0.3s;
        }
        .value-input-wrapper.invalid:not(.has-tags) {
            border: none;
            animation: shake 0.3s;
        }
        .value-input-wrapper.invalid:not(.has-tags) .value-input-field {
            border-color: #dc3545;
        }
        .value-input-wrapper.valid {
            border-color: #28a745;
        }
        .value-input-wrapper.valid:not(.has-tags) {
            border: none;
        }
        .value-input-wrapper.valid:not(.has-tags) .value-input-field {
            border-color: #28a745;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .value-tag {
            display: inline-flex;
            align-items: center;
            background-color: #2c5aa0;
            color: white;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 13px;
            gap: 6px;
            line-height: 1.4;
        }
        .value-tag-remove {
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            line-height: 1;
            padding: 0 2px;
        }
        .value-tag-remove:hover {
            color: #ffcccc;
        }
        .filter-row input {
            width: 100%;
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            height: 40px;
        }
        .value-input-field {
            border: none;
            outline: none;
            flex: 1;
            min-width: 100px;
            padding: 4px;
            font-size: 14px;
        }
        .value-input-wrapper.has-tags .value-input-field {
            height: auto;
            max-height: 30px;
        }
        .field-input.invalid, .value-input.invalid {
            color: #dc3545;
            font-style: italic;
            border-color: #dc3545;
        }
        .field-input.valid, .value-input.valid {
            border-color: #28a745;
        }
        .filter-row select {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: white;
            cursor: pointer;
            height: 40px;
            box-sizing: border-box;
        }
        .options-list {
            position: absolute;
            top: 100%;
            width: 100%;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-top: none;
            background-color: white;
            display: none;
            z-index: 1000;
            box-sizing: border-box;
        }
        .value-options {
            margin-top: 0;
        }
        .option-item, .value-item {
            padding: 8px;
            cursor: pointer;
            border-bottom: 1px solid #f0f0f0;
        }
        .option-item:hover, .value-item:hover {
            background-color: #e9e9e9;
        }
        .option-item.hidden, .value-item.hidden {
            display: none;
        }
        .remove-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
        }
        .remove-btn:hover {
            background-color: #c82333;
        }
        .add-btn {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }
        .add-btn:hover {
            background-color: #218838;
        }
        .clear-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 14px;
        }
        .clear-btn:hover {
            background-color: #5a6268;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .header-row h1 {
            margin: 0;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .checkbox-container label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="header-row">
        <h1>Flow Filter</h1>
        <button class="clear-btn" onclick="location.reload()">Clear Filters</button>
    </div>
    <div id="filtersContainer"></div>
    <div class="controls-row">
        <button class="add-btn" onclick="addFilter()">+ Add Filter</button>
        <div class="checkbox-container">
            <input type="checkbox" id="returnTraffic">
            <label for="returnTraffic">Return traffic</label>
        </div>
    </div>

    <script>
        let filterCount = 0;

        const fieldOptions = [
            {value: 'dest_ip', label: 'Dest IP'},
            {value: 'dest_kind', label: 'Dest Kind'},
            {value: 'dest_mac', label: 'Dest MAC'},
            {value: 'dest_name', label: 'Dest Name'},
            {value: 'dest_namespace', label: 'Dest Namespace'},
            {value: 'dest_node_ip', label: 'Dest Node IP'},
            {value: 'dest_node_name', label: 'Dest Node Name'},
            {value: 'dest_owner_name', label: 'Dest Owner Name'},
            {value: 'dest_port', label: 'Dest Port'},
            {value: 'dest_resource', label: 'Dest Resource'},
            {value: 'dest_subnet_label', label: 'Dest Subnet Label'},
            {value: 'dscp', label: 'DSCP'},
            {value: 'flow_layer', label: 'Flow layer'},
            {value: 'icmp_code', label: 'ICMP code'},
            {value: 'icmp_type', label: 'ICMP type'},
            {value: 'interface_directions', label: 'Interface Directions'},
            {value: 'network_interfaces', label: 'Network interfaces'},
            {value: 'node_direction', label: 'Node Direction'},
            {value: 'protocol', label: 'Protocol'},
            {value: 'source_ip', label: 'Source IP'},
            {value: 'source_kind', label: 'Source Kind'},
            {value: 'source_mac', label: 'Source MAC'},
            {value: 'source_name', label: 'Source Name'},
            {value: 'source_namespace', label: 'Source Namespace'},
            {value: 'source_node_ip', label: 'Source Node IP'},
            {value: 'source_node_name', label: 'Source Node Name'},
            {value: 'source_owner_name', label: 'Source Owner Name'},
            {value: 'source_port', label: 'Source Port'},
            {value: 'source_resource', label: 'Source Resource'},
            {value: 'source_subnet_label', label: 'Source Subnet Label'},
            {value: 'tcp_flags', label: 'TCP flags'}
        ];

        const valueOptions = [
            'default', 'kube-node-lease', 'kube-public', 'kube-system', 'netobserv',
            'netobserv-loki', 'netobserv-privileged', 'openshift', 'openshift-apiserver',
            'openshift-apiserver-operator', 'openshift-authentication', 'openshift-authentication-operator',
            'openshift-catalogd', 'openshift-cloud-controller-manager', 'openshift-cloud-controller-manager-operator',
            'openshift-cloud-credential-operator', 'openshift-cloud-network-config-controller',
            'openshift-cloud-platform-infra', 'openshift-cluster-csi-drivers', 'openshift-cluster-machine-approver',
            'openshift-cluster-node-tuning-operator', 'openshift-cluster-olm-operator',
            'openshift-cluster-samples-operator', 'openshift-cluster-storage-operator',
            'openshift-cluster-version', 'openshift-config', 'openshift-config-managed',
            'openshift-config-operator', 'openshift-console', 'openshift-console-operator',
            'openshift-console-user-settings', 'openshift-controller-manager',
            'openshift-controller-manager-operator', 'openshift-dns', 'openshift-dns-operator',
            'openshift-etcd', 'openshift-etcd-operator', 'openshift-host-network',
            'openshift-image-registry', 'openshift-infra', 'openshift-ingress',
            'openshift-ingress-canary', 'openshift-ingress-operator', 'openshift-insights',
            'openshift-kni-infra', 'openshift-kube-apiserver', 'openshift-kube-apiserver-operator',
            'openshift-kube-controller-manager', 'openshift-kube-controller-manager-operator',
            'openshift-kube-scheduler', 'openshift-kube-scheduler-operator',
            'openshift-kube-storage-version-migrator', 'openshift-kube-storage-version-migrator-operator',
            'openshift-machine-api', 'openshift-machine-config-operator', 'openshift-marketplace',
            'openshift-monitoring', 'openshift-multus', 'openshift-netobserv-operator',
            'openshift-network-console', 'openshift-network-diagnostics', 'openshift-network-node-identity',
            'openshift-network-operator', 'openshift-node', 'openshift-nutanix-infra',
            'openshift-oauth-apiserver', 'openshift-openstack-infra', 'openshift-operator-controller',
            'openshift-operator-lifecycle-manager', 'openshift-operators', 'openshift-operators-redhat',
            'openshift-ovirt-infra', 'openshift-ovn-kubernetes', 'openshift-route-controller-manager',
            'openshift-service-ca', 'openshift-service-ca-operator', 'openshift-user-workload-monitoring',
            'openshift-vsphere-infr'
        ];

        function addFilter() {
            const filterId = filterCount++;
            const container = document.getElementById('filtersContainer');

            const filterRow = document.createElement('div');
            filterRow.className = 'filter-row';
            filterRow.id = `filter-${filterId}`;

            // Field name dropdown
            const fieldOptionsHtml = fieldOptions.map(opt =>
                `<div class="option-item" data-value="${opt.value}">${opt.label}</div>`
            ).join('');

            // Value suggestions
            const valueSuggestionsHtml = valueOptions.map(val =>
                `<div class="value-item">${val}</div>`
            ).join('');

            filterRow.innerHTML = `
                <div class="dropdown-container">
                    <input type="text" class="field-input" placeholder="field name" data-filter-id="${filterId}">
                    <div class="options-list field-options">
                        ${fieldOptionsHtml}
                    </div>
                </div>
                <select class="operator-select">
                    <option value="=" selected>=</option>
                    <option value="!=">!=</option>
                </select>
                <div class="value-container">
                    <div class="value-input-wrapper" data-filter-id="${filterId}">
                        <input type="text" class="value-input-field" placeholder="values" data-filter-id="${filterId}">
                    </div>
                    <div class="options-list value-options">
                        ${valueSuggestionsHtml}
                    </div>
                </div>
                <button class="remove-btn" onclick="removeFilter(${filterId})">✕</button>
            `;

            container.appendChild(filterRow);
            attachFilterEvents(filterId);
        }

        function removeFilter(filterId) {
            const filterRow = document.getElementById(`filter-${filterId}`);
            if (filterRow) {
                filterRow.remove();
            }
        }

        function attachFilterEvents(filterId) {
            const filterRow = document.getElementById(`filter-${filterId}`);
            const fieldInput = filterRow.querySelector('.field-input');
            const fieldOptionsList = filterRow.querySelector('.field-options');
            const fieldOptions = filterRow.querySelectorAll('.field-options .option-item');

            const valueInputWrapper = filterRow.querySelector('.value-input-wrapper');
            const valueInputField = filterRow.querySelector('.value-input-field');
            const valueOptionsList = filterRow.querySelector('.value-options');
            const valueItems = filterRow.querySelectorAll('.value-options .value-item');

            const valueTags = [];
            let previousFieldType = null;

            // Helper function to strip quotes for validation purposes only
            function stripQuotes(value) {
                const trimmed = value.trim();
                if ((trimmed.startsWith('"') && trimmed.endsWith('"')) ||
                    (trimmed.startsWith("'") && trimmed.endsWith("'"))) {
                    return trimmed.slice(1, -1);
                }
                return trimmed;
            }

            // Field input events
            fieldInput.addEventListener('focus', function() {
                fieldOptionsList.style.display = 'block';
            });

            fieldInput.addEventListener('input', function() {
                const filter = this.value.toLowerCase();

                // Clear invalid state while typing
                fieldInput.classList.remove('invalid', 'valid');

                fieldOptions.forEach(option => {
                    const text = option.textContent.toLowerCase();
                    if (text.includes(filter)) {
                        option.classList.remove('hidden');
                    } else {
                        option.classList.add('hidden');
                    }
                });
            });

            fieldOptions.forEach(option => {
                option.addEventListener('click', function() {
                    fieldInput.value = this.textContent;
                    fieldOptionsList.style.display = 'none';
                    validateFieldInput();
                    updateValueFieldBehavior();
                });
            });

            // Validate field input on blur
            fieldInput.addEventListener('blur', function() {
                setTimeout(() => {
                    fieldOptionsList.style.display = 'none';
                }, 150);
                validateFieldInput();
                updateValueFieldBehavior();
            });

            function validateFieldInput() {
                const inputValue = fieldInput.value.trim();

                // Empty value is okay, reset to normal
                if (inputValue === '') {
                    fieldInput.classList.remove('invalid', 'valid');
                    return;
                }

                // Find case-insensitive match
                const matchedOption = Array.from(fieldOptions).find(option =>
                    option.textContent.toLowerCase() === inputValue.toLowerCase()
                );

                if (matchedOption) {
                    // Valid: update to proper case
                    fieldInput.value = matchedOption.textContent;
                    fieldInput.classList.remove('invalid');
                    fieldInput.classList.add('valid');

                    // Remove valid class after 1 second
                    setTimeout(() => {
                        fieldInput.classList.remove('valid');
                    }, 1000);
                } else {
                    // Invalid: mark as error
                    fieldInput.classList.remove('valid');
                    fieldInput.classList.add('invalid');
                }
            }

            function getFieldType(fieldName) {
                if (!fieldName) return 'text';

                const lowerFieldName = fieldName.toLowerCase();

                // Check for namespace fields
                if (lowerFieldName === 'source namespace' || lowerFieldName === 'dest namespace') {
                    return 'namespace';
                }

                // Check for MAC address fields
                if (lowerFieldName === 'source mac' || lowerFieldName === 'dest mac') {
                    return 'mac';
                }

                // Check for direction fields
                if (lowerFieldName === 'interface directions' || lowerFieldName === 'node direction') {
                    return 'direction';
                }

                // Check for TCP flags
                if (lowerFieldName === 'tcp flags') {
                    return 'tcp_flags';
                }

                // Check for IP fields
                if (lowerFieldName.includes('ip')) {
                    return 'ip';
                }

                // Default to text
                return 'text';
            }

            function addValueTag(value) {
                if (!value || valueTags.includes(value)) return;

                // Validate the value before adding
                if (!isValidValue(value)) {
                    return;
                }

                valueTags.push(value);

                const tag = document.createElement('span');
                tag.className = 'value-tag';
                tag.innerHTML = `
                    <span>${value}</span>
                    <span class="value-tag-remove">×</span>
                `;

                tag.querySelector('.value-tag-remove').addEventListener('click', function(e) {
                    e.stopPropagation();
                    removeValueTag(value);
                });

                valueInputWrapper.insertBefore(tag, valueInputField);

                // Update has-tags class
                if (valueTags.length > 0) {
                    valueInputWrapper.classList.add('has-tags');
                }

                // Hide the value from dropdown if it exists
                hideValueFromDropdown(value);
            }

            function hideValueFromDropdown(value) {
                const currentValueItems = valueOptionsList.querySelectorAll('.value-item');
                currentValueItems.forEach(item => {
                    if (item.textContent.toLowerCase() === value.toLowerCase()) {
                        item.setAttribute('data-selected', 'true');
                        item.classList.add('hidden');
                    }
                });
            }

            function showValueInDropdown(value) {
                const currentValueItems = valueOptionsList.querySelectorAll('.value-item');
                currentValueItems.forEach(item => {
                    if (item.textContent.toLowerCase() === value.toLowerCase()) {
                        item.removeAttribute('data-selected');
                        item.classList.remove('hidden');
                    }
                });
            }

            function removeValueTag(value) {
                const index = valueTags.indexOf(value);
                if (index > -1) {
                    valueTags.splice(index, 1);
                }

                // Remove the tag element
                const tags = valueInputWrapper.querySelectorAll('.value-tag');
                tags.forEach(tag => {
                    if (tag.textContent.replace('×', '').trim() === value) {
                        tag.remove();
                    }
                });

                // Update has-tags class
                if (valueTags.length === 0) {
                    valueInputWrapper.classList.remove('has-tags');
                }

                // Show the value back in dropdown
                showValueInDropdown(value);

                // Show dropdown for fields with dropdown options after any removal
                const fieldName = fieldInput.value.trim();
                const fieldType = getFieldType(fieldName);
                if (fieldType === 'namespace' || fieldType === 'direction' || fieldType === 'tcp_flags') {
                    valueInputField.focus();
                    valueOptionsList.style.display = 'block';
                    filterValueSuggestions();
                }
            }

            function isValidValue(value) {
                const fieldName = fieldInput.value.trim();
                const fieldType = getFieldType(fieldName);

                if (fieldType === 'ip') {
                    // Don't strip quotes - reject quoted values
                    const ipRegex = /^(\d{1,3}\.){3}\d{1,3}$/;
                    return ipRegex.test(value.trim());
                } else if (fieldType === 'mac') {
                    // Don't strip quotes - reject quoted values
                    const macRegex = /^([0-9A-Fa-f]{2}[:-]){5}([0-9A-Fa-f]{2})$/;
                    return macRegex.test(value.trim());
                } else if (fieldType === 'direction') {
                    // Don't strip quotes - reject quoted values
                    const validDirections = ['ingress', 'egress'];
                    return validDirections.includes(value.trim().toLowerCase());
                } else if (fieldType === 'tcp_flags') {
                    // Don't strip quotes - reject quoted values
                    const validFlags = ['FIN', 'SYN', 'RST', 'PSH', 'ACK', 'URG', 'ECE', 'CWR', 'SYN_ACK', 'FIN_ACK', 'RST_ACK'];
                    return validFlags.includes(value.trim().toUpperCase());
                }

                // For namespace and text, strip quotes for validation
                const cleanValue = stripQuotes(value);
                return cleanValue.trim() !== '';
            }

            function updateValueFieldBehavior() {
                const fieldName = fieldInput.value.trim();
                const fieldType = getFieldType(fieldName);

                // Only clear values if field type has changed
                const fieldTypeChanged = previousFieldType !== null && previousFieldType !== fieldType;
                previousFieldType = fieldType;

                // Clear existing dropdown options and rebuild based on field type
                valueOptionsList.innerHTML = '';

                // Update placeholder and dropdown based on field type
                if (fieldType === 'namespace') {
                    valueInputField.placeholder = 'values';
                    // Rebuild namespace dropdown
                    valueOptions.forEach(val => {
                        const item = document.createElement('div');
                        item.className = 'value-item';
                        item.textContent = val;
                        valueOptionsList.appendChild(item);
                    });
                    attachValueItemHandlers();
                    // Hide already selected values
                    valueTags.forEach(tag => hideValueFromDropdown(tag));
                } else if (fieldType === 'direction') {
                    valueInputField.placeholder = 'Ingress or Egress';
                    // Build direction dropdown
                    ['Ingress', 'Egress'].forEach(val => {
                        const item = document.createElement('div');
                        item.className = 'value-item';
                        item.textContent = val;
                        valueOptionsList.appendChild(item);
                    });
                    attachValueItemHandlers();
                    // Hide already selected values
                    valueTags.forEach(tag => hideValueFromDropdown(tag));
                } else if (fieldType === 'tcp_flags') {
                    valueInputField.placeholder = 'TCP flags';
                    // Build TCP flags dropdown
                    ['FIN', 'SYN', 'RST', 'PSH', 'ACK', 'URG', 'ECE', 'CWR', 'SYN_ACK', 'FIN_ACK', 'RST_ACK'].forEach(val => {
                        const item = document.createElement('div');
                        item.className = 'value-item';
                        item.textContent = val;
                        valueOptionsList.appendChild(item);
                    });
                    attachValueItemHandlers();
                    // Hide already selected values
                    valueTags.forEach(tag => hideValueFromDropdown(tag));
                } else if (fieldType === 'ip') {
                    valueInputField.placeholder = 'IP addresses';
                } else if (fieldType === 'mac') {
                    valueInputField.placeholder = 'MAC addresses';
                } else {
                    valueInputField.placeholder = 'values';
                }

                // Only clear the value input when field type changes
                if (fieldTypeChanged) {
                    valueInputField.value = '';
                    valueTags.length = 0;
                    valueInputWrapper.querySelectorAll('.value-tag').forEach(tag => tag.remove());
                    valueInputWrapper.classList.remove('invalid', 'valid', 'has-tags');
                }
            }

            function attachValueItemHandlers() {
                const currentValueItems = valueOptionsList.querySelectorAll('.value-item');
                currentValueItems.forEach(item => {
                    item.addEventListener('click', function() {
                        addValueTag(this.textContent);
                        valueInputField.value = '';
                        valueInputField.focus();

                        // Show dropdown again for next value
                        valueOptionsList.style.display = 'block';
                        filterValueSuggestions();
                    });
                });
            }

            // Click on wrapper focuses the input
            valueInputWrapper.addEventListener('click', function() {
                valueInputField.focus();
            });

            // Value input events
            valueInputField.addEventListener('focus', function() {
                const fieldName = fieldInput.value.trim();

                // Prevent entering values if field name is not selected
                if (!fieldName) {
                    fieldInput.focus();
                    setTimeout(() => {
                        fieldOptionsList.style.display = 'block';
                    }, 0);
                    return;
                }

                const fieldType = getFieldType(fieldName);

                // Show dropdown for fields with dropdown options
                if (fieldType === 'namespace' || fieldType === 'direction' || fieldType === 'tcp_flags') {
                    valueOptionsList.style.display = 'block';
                    filterValueSuggestions();
                }
            });

            valueInputField.addEventListener('blur', function(e) {
                const fieldName = fieldInput.value.trim();
                if (!fieldName) return;

                const fieldType = getFieldType(fieldName);
                const inputValue = this.value.trim();

                // Auto-correct case for enumerated fields on blur
                if (inputValue) {
                    if (fieldType === 'direction') {
                        const validDirections = ['Ingress', 'Egress'];
                        const matched = validDirections.find(dir => dir.toLowerCase() === inputValue.toLowerCase());
                        if (matched) {
                            this.value = matched;
                        }
                    } else if (fieldType === 'tcp_flags') {
                        const validFlags = ['FIN', 'SYN', 'RST', 'PSH', 'ACK', 'URG', 'ECE', 'CWR', 'SYN_ACK', 'FIN_ACK', 'RST_ACK'];
                        const matched = validFlags.find(flag => flag.toUpperCase() === inputValue.toUpperCase());
                        if (matched) {
                            this.value = matched;
                        }
                    }
                }

                // Validate for IP and MAC fields on blur
                if (fieldType === 'ip' || fieldType === 'mac') {
                    if (inputValue) {
                        if (isValidValue(inputValue)) {
                            valueInputWrapper.classList.remove('invalid');
                            valueInputWrapper.classList.add('valid');
                            setTimeout(() => {
                                valueInputWrapper.classList.remove('valid');
                            }, 1000);
                        } else {
                            valueInputWrapper.classList.remove('valid');
                            valueInputWrapper.classList.add('invalid');
                            // Don't remove invalid class - keep it until fixed
                        }
                    } else {
                        // Clear validation state if input is empty
                        valueInputWrapper.classList.remove('invalid', 'valid');
                    }
                }
            });

            valueInputField.addEventListener('input', function() {
                const fieldName = fieldInput.value.trim();
                const fieldType = getFieldType(fieldName);

                // Clear invalid state while typing (user is correcting)
                // But only clear if they're actually typing something
                if (this.value.trim()) {
                    valueInputWrapper.classList.remove('invalid', 'valid');
                }

                // Show dropdown for fields with dropdown options
                if (fieldType === 'namespace' || fieldType === 'direction' || fieldType === 'tcp_flags') {
                    valueOptionsList.style.display = 'block';
                    filterValueSuggestions();
                }
            });

            valueInputField.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Enter' || e.key === 'Tab') {
                    const rawValue = this.value.trim();
                    if (rawValue) {
                        if (isValidValue(rawValue)) {
                            e.preventDefault();

                            // Normalize case for enumerated fields
                            const fieldName = fieldInput.value.trim();
                            const fieldType = getFieldType(fieldName);
                            let valueToAdd = rawValue;

                            if (fieldType === 'direction') {
                                const validDirections = ['Ingress', 'Egress'];
                                const matched = validDirections.find(dir => dir.toLowerCase() === rawValue.toLowerCase());
                                if (matched) {
                                    valueToAdd = matched;
                                }
                            } else if (fieldType === 'tcp_flags') {
                                const validFlags = ['FIN', 'SYN', 'RST', 'PSH', 'ACK', 'URG', 'ECE', 'CWR', 'SYN_ACK', 'FIN_ACK', 'RST_ACK'];
                                const matched = validFlags.find(flag => flag.toUpperCase() === rawValue.toUpperCase());
                                if (matched) {
                                    valueToAdd = matched;
                                }
                            }

                            addValueTag(valueToAdd);
                            this.value = '';
                            valueInputWrapper.classList.remove('invalid', 'valid');

                            // Show dropdown again for next value if applicable
                            if (fieldType === 'namespace' || fieldType === 'direction' || fieldType === 'tcp_flags') {
                                valueOptionsList.style.display = 'block';
                                filterValueSuggestions();
                            } else {
                                valueOptionsList.style.display = 'none';
                            }
                        } else {
                            // Only prevent default for Space and Enter, not Tab
                            if (e.key === ' ' || e.key === 'Enter') {
                                e.preventDefault();
                            }

                            // Show invalid state - shake and red border
                            valueInputWrapper.classList.remove('invalid');
                            // Force reflow to restart animation
                            void valueInputWrapper.offsetWidth;
                            valueInputWrapper.classList.add('invalid');
                            // Keep invalid state - don't auto-remove
                        }
                    } else if (e.key === ' ' || e.key === 'Enter') {
                        e.preventDefault();
                    }
                } else if (e.key === 'Backspace' && this.value === '' && valueTags.length > 0) {
                    e.preventDefault();
                    removeValueTag(valueTags[valueTags.length - 1]);
                }
            });

            function filterValueSuggestions() {
                const inputValue = valueInputField.value;
                const fieldName = fieldInput.value.trim();
                const fieldType = getFieldType(fieldName);

                // Only strip quotes for namespace and text fields
                let currentWord;
                if (fieldType === 'namespace' || fieldType === 'text') {
                    currentWord = stripQuotes(inputValue).toLowerCase();
                } else {
                    // For direction and tcp_flags, don't strip quotes
                    currentWord = inputValue.trim().toLowerCase();
                }

                // Get current value items from the dropdown
                const currentValueItems = valueOptionsList.querySelectorAll('.value-item');
                currentValueItems.forEach(item => {
                    // Don't show items that are already selected
                    if (item.getAttribute('data-selected') === 'true') {
                        item.classList.add('hidden');
                        return;
                    }

                    const text = item.textContent.toLowerCase();
                    if (text.includes(currentWord)) {
                        item.classList.remove('hidden');
                    } else {
                        item.classList.add('hidden');
                    }
                });
            }

            // Close dropdowns when clicking outside
            document.addEventListener('click', function(event) {
                if (!event.target.closest(`#filter-${filterId} .dropdown-container`)) {
                    fieldOptionsList.style.display = 'none';
                }
                if (!event.target.closest(`#filter-${filterId} .value-container`)) {
                    valueOptionsList.style.display = 'none';
                }
            });
        }

        // Add initial filter on page load
        addFilter();
    </script>
</body>
</html>
